{{- $minAvailable := .Values.scheduling.minAvailable }}
{{- $maxUnavailable := .Values.scheduling.maxUnavailable }}
{{- $replicas := int .Values.replicas }}
{{- $shouldCreatePDB := false }}

{{- if ne $replicas 1 }}
  {{- if ne $maxUnavailable nil }}
    {{- if or (and (kindIs "string" $maxUnavailable) (hasSuffix "%" $maxUnavailable)) (kindIs "int" $maxUnavailable) (kindIs "float64" $maxUnavailable) }}
      {{- $shouldCreatePDB = true }}
    {{- end }}
  {{- else if and (kindIs "string" $minAvailable) (hasSuffix "%" $minAvailable) }}
    {{- $shouldCreatePDB = true }}
  {{- else if or (kindIs "int" $minAvailable) (kindIs "float64" $minAvailable) }}
    {{- if lt (float64 $minAvailable) (float64 $replicas) }}
      {{- $shouldCreatePDB = true }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if $shouldCreatePDB }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "generic-service.fullname" . }}
  labels: {{- include "generic-service.top-level-labels" . | nindent 4 }}

spec:
  {{- if ne $maxUnavailable nil }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else }}
  minAvailable: {{ $minAvailable }}
  {{- end }}

  selector:
    matchLabels: {{- include "generic-service.selector-labels" . | nindent 6 }}

{{- end }}

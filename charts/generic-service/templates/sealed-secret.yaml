{{- range $name, $secret := .Values.secrets }}
{{- if $secret.encryptedFiles }}
{{- $scope := $secret.sealingScope | default "strict" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ tpl $name $ }}
  labels: {{- include "generic-service.top-level-labels" $ | nindent 4 }}
  {{- if ne $scope "strict" }}
  annotations:
    sealedsecrets.bitnami.com/{{ $scope }}: "true"
  {{- end }}
spec:
  encryptedData:
    {{- range $key, $val := $secret.encryptedFiles }}
    {{ $key | quote }}: {{ $val | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ tpl $name $ }}
      labels: {{- include "generic-service.top-level-labels" $ | nindent 8 }}
      {{- if ne $scope "strict" }}
      annotations:
        sealedsecrets.bitnami.com/{{ $scope }}: "true"
      {{- end }}
    type: Opaque
    {{- with $secret.files }}
    # SealedSecret templates take plain-text values
    data:
      {{- range $key, $val := . }}
      {{ $key | quote }}: {{ if $secret.stringData }}{{ $val | quote }}{{ else }}{{ $val | b64dec | quote }}{{ end }}
      {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}

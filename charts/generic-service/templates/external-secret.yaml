{{- range $name, $secret := .Values.secrets }}
{{- if or $secret.externalFiles $secret.externalDataFrom }}
{{- if $secret.encryptedFiles }}
  {{- fail (printf "secrets.%s.encryptedFiles cannot be combined with externalFiles or externalDataFrom" $name) }}
{{- end }}
{{- $store := $secret.externalStore | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ tpl $name $ }}
  labels: {{- include "generic-service.top-level-labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ $store.name | required (printf "secrets.%s.externalStore.name is required if externalFiles or externalDataFrom is set" $name) | quote }}
    kind: {{ $store.kind | default "SecretStore" }}
  refreshInterval: {{ $secret.externalRefreshInterval | default "1h" | quote }}
  target:
    name: {{ tpl $name $ }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels: {{- include "generic-service.top-level-labels" $ | nindent 10 }}
      {{- with $secret.files }}
      mergePolicy: Merge
      # ExternalSecret templates take plain-text values (rendered as literals)
      data:
        {{- range $key, $val := . }}
        {{ $key | quote }}: {{ printf "{{ %s }}" ((ternary $val ($val | b64dec) (eq $secret.stringData true)) | toJson) | quote }}
        {{- end }}
      {{- end }}
  {{- with $secret.externalFiles }}
  data:
    {{- range $key, $ref := . }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        {{- if kindIs "string" $ref }}
        key: {{ tpl $ref $ | quote }}
        {{- else }}
        key: {{ tpl ($ref.key | required (printf "secrets.%s.externalFiles.%s.key is required" $name $key)) $ | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $secret.externalDataFrom }}
  dataFrom: {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}

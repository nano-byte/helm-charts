{{- $sources := compact (list (ternary "secretConfig" "" (not (empty .Values.secretConfig))) (ternary "secretConfigEncrypted" "" (not (empty .Values.secretConfigEncrypted))) (ternary "secretConfigExternal" "" (not (empty .Values.secretConfigExternal)))) }}
{{- if gt (len $sources) 1 }}
  {{- fail (printf "Only one of secretConfig, secretConfigEncrypted and secretConfigExternal can be set (got %s)" (join ", " $sources)) }}
{{- end }}
{{- $name := printf "%s-secret-config" (include "generic-service.fullname" .) }}
{{- if .Values.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "generic-service.top-level-labels" . | nindent 4 }}
type: Opaque
stringData:
  secret.json: | {{- .Values.secretConfig | toPrettyJson | nindent 4 }}
{{- else if .Values.secretConfigEncrypted }}
{{- $scope := .Values.secretConfigSealingScope | default "strict" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels: {{- include "generic-service.top-level-labels" . | nindent 4 }}
  {{- if ne $scope "strict" }}
  annotations:
    sealedsecrets.bitnami.com/{{ $scope }}: "true"
  {{- end }}
spec:
  encryptedData:
    secret.json: {{ .Values.secretConfigEncrypted | quote }}
  template:
    metadata:
      name: {{ $name }}
      labels: {{- include "generic-service.top-level-labels" . | nindent 8 }}
      {{- if ne $scope "strict" }}
      annotations:
        sealedsecrets.bitnami.com/{{ $scope }}: "true"
      {{- end }}
    type: Opaque
{{- else if .Values.secretConfigExternal }}
{{- $store := .Values.secretConfigExternalStore | default dict }}
{{- $ref := .Values.secretConfigExternal }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{- include "generic-service.top-level-labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ $store.name | required "secretConfigExternalStore.name is required if secretConfigExternal is set" | quote }}
    kind: {{ $store.kind | default "SecretStore" }}
  refreshInterval: {{ .Values.secretConfigExternalRefreshInterval | default "1h" | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels: {{- include "generic-service.top-level-labels" . | nindent 10 }}
  data:
    - secretKey: secret.json
      remoteRef:
        {{- if kindIs "string" $ref }}
        key: {{ tpl $ref . | quote }}
        {{- else }}
        key: {{ tpl ($ref.key | required "secretConfigExternal.key is required") . | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
        {{- end }}
{{- end }}

{{- if .Values.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-service.fullname" . }}-secret-config
  labels: {{- include "generic-service.top-level-labels" . | nindent 4 }}
type: Opaque
stringData:
  secret.json: | {{- .Values.secretConfig | toPrettyJson | nindent 4 }}
{{- end }}

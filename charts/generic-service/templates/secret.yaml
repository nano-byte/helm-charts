{{- range $name, $secret := .Values.secrets }}
{{- if $secret.files }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $name $ }}
  labels: {{- include "generic-service.top-level-labels" $ | nindent 4 }}
type: Opaque
{{- if $secret.stringData }}
stringData:
  {{- range $key, $val := $secret.files }}
  {{ $key | quote }}: {{ $val | quote }}
  {{- end }}
{{- else }}
data:
  {{- range $key, $val := $secret.files }}
  {{ $key | quote }}: {{ $val }}
  {{- end }}
{{- end }}
---
{{- end }}
{{- end }}

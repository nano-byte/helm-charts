# Sealed Secret test

image:
  repository: jwilder/whoami
  tag: latest

secrets:
  '{{ .Release.Name }}':
    mountPath: /mysecret
    optional: true  # no controller in CI to create the Secret
    encryptedFiles:
      password: AgBy3i4OJSWK+PiTySYZZA==
    files:
      username: dGVzdA==
  '{{ .Release.Name }}-cluster':
    mountPath: /mysecret-cluster
    optional: true  # no controller in CI to create the Secret
    sealingScope: cluster-wide
    stringData: true
    encryptedFiles:
      token: AgCx9k2LMNOP+QrStUvWxA==
    files:
      endpoint: https://example.com

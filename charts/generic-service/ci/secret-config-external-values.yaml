# External secret config test

image:
  repository: jwilder/whoami
  tag: latest

secretConfigOptional: true  # no controller in CI to create the Secret
secretConfigExternalStore:
  name: aws-secretsmanager
  kind: ClusterSecretStore
secretConfigExternalRefreshInterval: 15m
secretConfigExternal:
  key: '{{ .Release.Namespace }}/app-config'
  version: AWSCURRENT

# Cilium network policy test

image:
  repository: jwilder/whoami
  tag: latest

netpol:
  enabled: true
  ingressNamespaces: [monitoring]
  egressNamespaces: [database]
  ingressEndpoints:
    labels:
      app.kubernetes.io/name: client
    ports:
      - port: 443
        protocol: TCP
      - port: 80
        protocol: UDP
  egressFQDNs:
    - api.github.com
    - pattern: '*.example.com'
      ports:
        - port: 8443
  egressEndpoints:
    - labels:
        app.kubernetes.io/name: backend
      ports:
        - port: 443
        - port: 80

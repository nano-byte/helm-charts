# External Secret test

image:
  repository: jwilder/whoami
  tag: latest

secrets:
  '{{ .Release.Name }}':
    mountPath: /mysecret
    externalStore:
      name: vault
    externalFiles:
      password:
        key: '{{ .Release.Namespace }}/db'
        property: password
      token: some/flat-secret
    files:
      username: dGVzdA==
  '{{ .Release.Name }}-bulk':
    mountPath: /mysecret-bulk
    externalStore:
      name: aws-secretsmanager
      kind: ClusterSecretStore
    externalRefreshInterval: 15m
    externalDataFrom:
      - extract:
          key: some/json-secret
